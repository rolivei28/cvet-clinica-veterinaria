services:
  - type: web
    name: cvet-api
    runtime: docker
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      # Neon: defina no dashboard do Render (connection string com sslmode=require)
      - key: DATABASE_URL
        sync: false

  - type: web
    name: cvet-web
    runtime: docker
    region: oregon
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: API_URL
        value: https://cvet-api.onrender.com
